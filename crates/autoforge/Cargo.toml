[package]
name = "autoforge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AutoForge — rangement, tri et identification automatiques de fichiers (IA locale optionnelle)"

[[bin]]
name = "autoforge"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { workspace = true }
rfd = { workspace = true }
ff-auto = { workspace = true }
ff-profiles = { workspace = true }
ff-kit = { workspace = true }
ff-core = { workspace = true }
