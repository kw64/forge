[package]
name = "ff-auto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AutoForge — moteur : tri par règles, IA locale (LM Studio), identification web/DAT, plans annulables"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ff-profiles = { workspace = true }
ureq = { version = "2", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "gif"] }
kamadak-exif = "0.6"
lofty = "0.22"
crc32fast = "1"
sha1_smol = "1"
regex = "1"
zip = { version = "2", default-features = false }
