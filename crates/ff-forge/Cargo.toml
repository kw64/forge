[package]
name = "ff-forge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FileForge — gestionnaire de fichiers double panneau (esprit FileMaster/Amiga)"

[[bin]]
name = "fileforge"
path = "src/main.rs"

[build-dependencies]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { workspace = true }
rfd = { workspace = true }
dirs = { workspace = true }
anyhow = { workspace = true }
ff-core = { workspace = true }
ff-profiles = { workspace = true }
ff-kit = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
sevenz-rust = { version = "0.6", features = ["compress", "aes256"] }
tar = "0.4"
flate2 = "1"
delharc = "0.8"
fs2 = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
regex = "1"

# Glisser-déposer vers l'extérieur (OLE Windows)
[target.'cfg(windows)'.dependencies]
drag = "2.1.1"
raw-window-handle = "0.6"
